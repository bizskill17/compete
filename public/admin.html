<section id="login" class="login-wrap hide"><div class="login-side"><div class="login-card"><a class="brand login-brand" href="/">compete.</a><h1>Welcome back.</h1><p class="muted">Log in to your admin account.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" minlength="4" maxlength="20" required><button class="orange">Sign in to dashboard →</button><p id="loginError" class="error" role="alert"></p></form><p><a id="forgotPassword" href="#forgot-password">Forgot password?</a></p><div class="setup-note"><p><a href="/">← Back to competitions</a></p></div></div></div></section>

<script>
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const feeLabel=n=>Number(n)===0?'Free':money(n);
function adminIcon(key){const paths={profile:'M20 21v-2a7 7 0 0 0-14 0v2M13 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',dashboard:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',categories:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',competitions:'M8 3h8v7a4 4 0 0 1-8 0ZM8 5H4v3a4 4 0 0 0 4 4M16 5h4v3a4 4 0 0 1-4 4M12 14v6M8 21h8',participants:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 3a4 4 0 0 1 0 8M22 21v-3a4 4 0 0 0-3-4',entries:'M5 3h14v18H5ZM9 7h6M9 11h6M9 15h4',payments:'M3 5h18v14H3ZM3 10h18M7 15h3',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z'};return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(paths[key]||paths.entries)+'"/></svg>';}
const sections={dashboard:'Dashboard',categories:'Categories',competitions:'Competitions',participants:'Participants',entries:'Entries & Judging',payments:'Payments',profile:'My Profile',settings:'Settings'};
let ownProfile;let data,user,branding={name:'compete.',logo:false,updatedAt:''},section='dashboard',query='',editorKind,editing;let toastTimer;
async function api(path,body){const r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to complete request');return d;}
function applyBrand(next){branding={name:String(next?.name||'compete.'),logo:next?.logo===true,updatedAt:next?.updatedAt||''};document.title=branding.name;document.querySelectorAll('.brand').forEach(el=>{el.classList.toggle('has-logo',branding.logo);el.innerHTML=(branding.logo?'<img class="brand-logo" src="/api/branding/logo?v='+encodeURIComponent(branding.updatedAt)+'" alt="">':'')+safe(branding.name);});}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),5000)}
async function load(){const state=await api('state');applyBrand(state.branding);user=state.user;if(!state.admin){$('#app').classList.add('hide');$('#login').classList.remove('hide');if(user)$('#loginError').textContent='Your account does not have administrator access. Sign in with an administrator account.';return;}
 data=await api('admin/overview');applyBrand(data.branding||branding);$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=user.email;$('#accountName').textContent=user.name||'Administrator';$('#accountAvatar').textContent=(user.name||user.email||'A').split(/\s+/).map(n=>n[0]).slice(0,2).join('').toUpperCase();render();}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button:not(.password-toggle)');button.disabled=true;$('#loginError').textContent='';try{await api('auth/login',Object.fromEntries(new FormData(e.target)));e.target.reset();await load()}catch(error){$('#loginError').textContent=error.message}finally{button.disabled=false}};
$('#forgotPassword').onclick=async e=>{e.preventDefault();const form=$('#loginForm'),email=form.elements.email.value.trim(),error=$('#loginError');if(!email){error.textContent='Enter your email address first.';form.elements.email.focus();return;}const link=$('#forgotPassword');link.textContent='Sending reset link…';link.setAttribute('aria-disabled','true');error.textContent='';try{const result=await api('auth/forgot',{email});error.style.color='var(--ink)';error.textContent=result.message;link.textContent='Reset link requested';}catch(err){error.style.color='';error.textContent=err.message;link.textContent='Forgot password?';link.removeAttribute('aria-disabled');}};
$('#logout').onclick=async()=>{try{await api('auth/logout',{});location.assign('/admin')}catch(e){toast(e.message)}};
$('#nav').innerHTML=Object.entries(sections).map(([key,label])=>'<button data-section="'+key+'">'+adminIcon(key)+'<span>'+label+'</span></button>').join('');
async function openAdminSection(next){try{if(next==='profile')ownProfile=(await api('participant/overview')).profile;section=next;query='';render();}catch(e){toast(e.message)}}
$('#nav').onclick=e=>{const button=e.target.closest('[data-section]');if(button)openAdminSection(button.dataset.section);};
const badge=(text)=>{const value=String(text??'');const label=value?value[0].toUpperCase()+value.slice(1):'';return '<span class="badge '+(['pending','review','draft'].includes(value)?'warn':['rejected','Suspended'].includes(value)?'bad':'')+'">'+safe(label)+'</span>';};
const compName=id=>data.competitions.find(c=>c.id===id)?.title||id;
const date=s=>s?new Date(s+'T12:00:00+05:30').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'}):'—';
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No records yet.</div>')+'</div>'}
const match=o=>JSON.stringify(o).toLowerCase().includes(query.toLowerCase());
const editIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-13 13H3v-5L16 3Z"/><path d="m14 5 5 5"/></svg>';
const deleteIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
function actions(kind,id){const attribute={category:'category',competition:'comp',participant:'user'}[kind];return '<span class="record-actions"><button type="button" class="icon-action" data-edit-'+attribute+'="'+safe(id)+'" aria-label="Edit '+kind+'" title="Edit '+kind+'">'+editIcon+'</button><button type="button" class="icon-action delete" data-delete-kind="'+kind+'" data-delete-id="'+safe(id)+'" aria-label="Delete '+kind+'" title="Delete '+kind+'">'+deleteIcon+'</button></span>';}
async function removeRecord(button){const kind=button.dataset.deleteKind,id=button.dataset.deleteId;const records=kind==='category'?data.categories:kind==='competition'?data.competitions:kind==='participant'?data.participants:data.entries;const record=records.find(r=>r.id===id);if(!record||!window.confirm('Delete '+kind+' "'+(record.title||record.name)+'"? This cannot be undone.'))return;button.disabled=true;try{await api('admin/delete',{kind,id});data=await api('admin/overview');render();toast('Deleted successfully.')}catch(error){toast(error.message)}finally{button.disabled=false;}}
function competitionRows(items){return items.map(c=>'<tr><td class="wrap"><b>'+safe(c.title)+'</b><small>'+safe(c.category)+'</small></td><td>'+date(c.deadline)+'<small>11:59 PM IST</small></td><td>'+data.entries.filter(e=>e.competition===c.id).length+'</td><td>'+badge(c.status)+'</td><td>'+feeLabel(c.fee)+'</td><td>'+actions('competition',c.id)+'<button class="secondary" data-publish="'+safe(c.id)+'" style="margin-top:8px">'+(c.resultsPublished?'Unpublish results':'Publish results')+'</button></td></tr>')}
function connections(){return Object.entries({database:'MySQL database',payments:'Razorpay payments',webhook:'Payment webhook',ai:'AI judging'}).map(([key,label])=>'<div class="connection"><span>'+label+'</span>'+badge(data.ready[key]?'Configured':'Not configured')+'</div>').join('')}
function render(){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#title').textContent=section==='dashboard'?'':sections[section];
 let html='';if(section==='dashboard'){html='<div class="metrics">'+[['Total participants',data.stats.participants,'Participant accounts'],['Active competitions',data.stats.active,'Currently open for entries'],['Entries awaiting review',data.stats.pending,'Pending or flagged for review'],['Payments received',money(data.stats.collected/100),'Verified captured payments']].map(([label,value,note],i)=>'<div class="metric dashboard-link" data-dashboard-go="'+['participants','competitions','entries','payments'][i]+'" role="button" tabindex="0" aria-label="View '+label+'"><div class="metric-icon tone-'+i+'">'+adminIcon(['participants','competitions','entries','payments'][i])+'</div><span class="muted">'+label+'</span><strong>'+value+'</strong><small>'+note+'</small></div>').join('')+'</div><div class="two"><div class="card"><div class="row"><h2>Competitions</h2><div class="row"><button class="orange" data-new="competition">＋ Create competition</button><button class="secondary" data-go="competitions">View all →</button></div></div>'+table(['Competition','Deadline','Entries','Status','Fee','Actions'],competitionRows(data.competitions.slice(0,6)))+'</div><div class="card"><h2>Connections</h2>'+connections()+'<p class="muted">Configured status checks saved settings, not provider connectivity.</p></div></div>';}

 else{const add={categories:['category','Add category'],competitions:['competition','Create competition'],participants:['participant','Add participant']};html='<div class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search '+safe(sections[section].toLowerCase())+'…" aria-label="Search records" value="'+safe(query)+'">'+(add[section]?'<button class="orange" data-new="'+add[section][0]+'">＋ '+add[section][1]+'</button>':'')+'</div><div id="records">'+records()+'</div></div>';}$('#content').innerHTML=html;bind();const search=$('#search');if(search)search.oninput=e=>{query=e.target.value;$('#records').innerHTML=records();bind()};}

erCase();toast('Profile saved.');}catch(error){$('#adminProfileError').textContent=error.message}finally{b.disabled=false}};document.querySelectorAll('[data-person-photo]').forEach(b=>b.onclick=()=>{const p=data.participants.find(p=>p.id===b.dataset.personPhoto);$('#previewBody').innerHTML='<h2>'+safe(p.name)+'</h2><img style="display:block;width:240px;max-width:100%;aspect-ratio:3/4;object-fit:cover;margin:16px auto" src="/api/admin/participant-photo/'+encodeURIComponent(p.id)+'" alt="Participant passport photo">';$('#preview').showModal();});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{const c=data.competitions.find(c=>c.id===b.dataset.publish);if(!window.confirm(c.resultsPublished?'Hide published scores and winner certificates?':'Publish final scores, feedback and winner certificates? All entries must be reviewed and accepted entries scored.'))return;b.disabled=true;try{await api('admin/results',{id:c.id,publish:!c.resultsPublished});data=await api('admin/overview');render();toast(c.resultsPublished?'Results unpublished.':'Results published.');}catch(e){toast(e.message)}finally{b.disabled=false}});document.querySelectorAll('[data-delete-kind]').forEach(b=>b.onclick=()=>removeRecord(b));document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>edit(b.dataset.new));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{section=b.dataset.go;query='';render()});document.querySelectorAll('[data-edit-comp]').forEach(b=>b.onclick=()=>edit('competition',data.competitions.find(c=>c.id===b.dataset.editComp)));document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>edit('category',data.categories.find(c=>c.id===b.dataset.editCategory)));document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>edit('participant',data.participants.find(c=>c.id===b.dataset.editUser)));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(data.entries.find(e=>e.id===b.dataset.review)));}

]+' prize (₹)','p'+i,p,'number','required min="0" step="0.01"')).join('')+'</div></section><p class="muted"></p>'+(names.length?'':'<div class="notice">Add an active category in Categories before creating a competition.</div>')+'</div>';}
if(kind==='competition')html+='<div><label for="thumbnailUpload">Competition thumbnail</label><input id="thumbnailUpload" type="file" accept="image/jpeg,image/png,image/webp"><small></small><div class="thumbnail-preview-row"><img id="thumbnailPreview" alt="Competition thumbnail preview" style="display:'+(item?.thumbnail?'block':'none')+';width:100%;max-height:220px;object-fit:contain;margin-top:12px" '+(item?.thumbnail?'src="/api/thumbnail/'+encodeURIComponent(item.id)+'"':'')+'><button id="removeThumbnail" type="button" class="thumbnail-remove" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>Remove thumbnail</button></div></div>';

// Enhance static and dynamically-created password fields without submitting forms.
function enhancePasswords() {
  if (!globalThis.document) return;
  document.querySelectorAll('input[type="password"]').forEach(input => {
    if (input.parentElement.classList.contains('password-wrap')) return;
    const wrap = document.createElement('div'); wrap.className = 'password-wrap';
    input.before(wrap); wrap.append(input);
    const toggle = document.createElement('button'); toggle.type = 'button';
    toggle.className = 'password-toggle'; toggle.setAttribute('aria-label', 'Show password');
    toggle.setAttribute('aria-pressed', 'false');
    toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18" style="display:none"/></svg>';
    toggle.onclick = () => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); toggle.setAttribute('aria-pressed', String(show)); toggle.querySelector('.eye-slash').style.display = show ? '' : 'none'; };
    wrap.append(toggle);
  });
}
enhancePasswords();
new MutationObserver(enhancePasswords).observe(document.body, { childList: true, subtree: true });
document.addEventListener('reset', e => { e.target.querySelectorAll('.password-wrap input').forEach(input => { input.type = 'password'; const toggle = input.parentElement.querySelector('.password-toggle'); toggle.setAttribute('aria-label', 'Show password'); toggle.setAttribute('aria-pressed', 'false'); toggle.querySelector('.eye-slash').style.display = 'none'; }); });
</script></body></html>
