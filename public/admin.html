<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compete | Admin dashboard</title><style>
:root{--ink:#153f35;--orange:#ee763c;--line:#e1e7df;--muted:#6d7b75;--bg:#f8f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit}button{border:0;border-radius:8px;padding:11px 16px;background:var(--ink);color:white;font-weight:600}button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}button.orange{background:var(--orange)}button.danger{background:#a83232}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;padding:12px;border:1px solid #cdd7cd;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:100px}label{display:block;font-size:12px;font-weight:650;margin:16px 0 6px}.brand{font-size:26px;font-weight:800;letter-spacing:-1px;text-decoration:none}.brand span{color:var(--orange)}.muted,small{color:var(--muted);line-height:1.7}h1{font-size:30px;letter-spacing:-1px;margin:4px 0 8px}h2{font-size:20px;margin:0 0 14px}p{line-height:1.6}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.hide{display:none!important}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:var(--ink);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}aside .brand{padding:0 12px 28px}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;color:#d9e6dd;padding:13px 15px}nav button.active{background:#ffffff20;color:white;border-left:3px solid var(--orange)}.side-bottom{margin-top:auto;display:grid;gap:16px;padding:18px 12px 0}.side-bottom a{font-size:12px;text-decoration:none}.workspace{padding:32px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.metric,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.metric strong{display:block;font-size:29px;margin:13px 0 4px}.metric small{font-size:11px}.metric:before{content:'';display:block;width:25px;height:4px;background:var(--orange);border-radius:4px;margin-bottom:14px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}.toolbar input{max-width:330px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;border-bottom:1px solid var(--line);padding:15px 12px;max-width:340px}td.wrap{white-space:normal;min-width:180px}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#f7f8f4}td small{display:block;font-size:11px}td button,td a.action{padding:7px 10px;font-size:12px;margin:3px;display:inline-block}.badge{padding:5px 9px;font-size:11px;border-radius:20px;background:#eaf2e7;display:inline-block}.badge.warn{background:#fff0dd;color:#975514}.badge.bad{background:#fbe4e4;color:#9b3333}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}.connection{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:14px}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr}.login-art{background:var(--ink);color:white;padding:60px;display:flex;flex-direction:column;justify-content:center}.login-art h1{font-size:clamp(36px,5vw,62px);line-height:1.1;margin:35px 0}.login-art p{color:#d4e0d5;max-width:420px}.sun{font-size:110px;color:var(--orange)}.login-side{display:grid;place-items:center;padding:32px}.login-card{width:100%;max-width:410px}.login-card form{margin-top:26px}.login-card button{width:100%;margin-top:22px}.setup-note{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:12px}.setup-note code{display:inline-block;background:#eef1e8;padding:4px 7px;border-radius:4px}dialog{border:1px solid var(--line);border-radius:18px;color:var(--ink);width:min(650px,94vw);max-height:90vh;padding:28px}dialog::backdrop{background:#0e302ab3}.close{float:right;background:#eef1e8;color:var(--ink);padding:5px 11px;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}.error{color:#a12f2f;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:15px 22px;border-radius:10px;z-index:20;max-width:90vw}.image{display:block;max-width:100%;max-height:50vh;margin:auto;border-radius:8px}.notice{background:#fff0dd;padding:14px;border-radius:8px;color:#875523;font-size:12px;margin:16px 0}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}@media(max-width:1100px){.metrics{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:740px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:18px}aside .brand{padding:0 0 15px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.side-bottom{margin-top:12px;display:flex;align-items:center;justify-content:space-between;padding:8px 0}.workspace{padding:20px}.topbar{align-items:flex-start}.topbar small{display:none}.login-wrap{grid-template-columns:1fr}.login-art{display:none}.metrics{gap:10px}.metric{padding:16px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}}

.password-wrap{position:relative;width:100%}.password-wrap input{padding-right:48px}.password-wrap button.password-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;padding:8px;margin:0;display:grid;place-items:center;background:transparent;color:#153f35;border:0;border-radius:6px;cursor:pointer}.password-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.password-toggle:hover{background:#153f3510}.password-toggle:focus-visible{outline:2px solid #ee763c;outline-offset:1px}
.record-actions{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.record-actions button.icon-action{width:34px;height:34px;padding:7px;margin:0;display:inline-grid;place-items:center;border:1px solid #d3e1cf;background:#edf3e9;color:#153f35;border-radius:7px}.record-actions button.icon-action.delete,button.icon-action.delete{border-color:#f2ceca;background:#fff0ed;color:#c13d34}.icon-action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-action:hover{filter:brightness(.95)}</style></head><body>
<section id="login" class="login-wrap hide"><div class="login-side"><div class="login-card"><h1>Welcome back.</h1><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" minlength="4" maxlength="20" required><button class="orange">Sign in to dashboard →</button><p id="loginError" class="error" role="alert"></p></form><div class="setup-note"><p><a href="/">← Back to competitions</a></p></div></div></div></section>
<section id="app" class="shell hide"><aside><a class="brand" href="/"><span>✳</span> compete.</a><nav id="nav"></nav><div class="side-bottom"><a href="/">↗ View public website</a><button id="logout" class="danger">Log out</button></div></aside><main class="workspace"><header class="topbar"><div><div class="eyebrow">Compete administration</div><h1 id="title">Admin dashboard</h1><div class="muted" id="subtitle">Manage your competitions and celebrate creativity.</div></div><small id="who"></small></header><div id="content"></div></main></section>
<dialog id="editor"><button class="close" type="button" aria-label="Close dialog">×</button><h2 id="editorTitle"></h2><form id="editorForm"></form><p id="editorError" class="error" role="alert"></p></dialog><dialog id="preview"><button class="close" aria-label="Close preview">×</button><div id="previewBody"></div></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const feeLabel=n=>Number(n)===0?'Free':money(n);
const sections={dashboard:'Dashboard',categories:'Categories',competitions:'Competitions',participants:'Participants',entries:'Entries & judging',payments:'Payments',settings:'Settings'};
let data,user,section='dashboard',query='',editorKind,editing;let toastTimer;
async function api(path,body){const r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to complete request');return d;}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),5000)}
async function load(){const state=await api('state');user=state.user;if(!state.admin){$('#app').classList.add('hide');$('#login').classList.remove('hide');if(user)$('#loginError').textContent='Your account does not have administrator access. Sign in with an administrator account.';return;}
 data=await api('admin/overview');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=user.email;render();}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button:not(.password-toggle)');button.disabled=true;$('#loginError').textContent='';try{await api('auth/login',Object.fromEntries(new FormData(e.target)));e.target.reset();await load()}catch(error){$('#loginError').textContent=error.message}finally{button.disabled=false}};
$('#logout').onclick=async()=>{try{await api('auth/logout',{});location.assign('/admin')}catch(e){toast(e.message)}};
$('#nav').innerHTML=Object.entries(sections).map(([key,label])=>'<button data-section="'+key+'">'+label+'</button>').join('');
$('#nav').onclick=e=>{if(e.target.dataset.section){section=e.target.dataset.section;query='';render()}};
const badge=(text)=>'<span class="badge '+(['pending','review','draft'].includes(text)?'warn':['rejected','Suspended'].includes(text)?'bad':'')+'">'+safe(text)+'</span>';
const compName=id=>data.competitions.find(c=>c.id===id)?.title||id;
const date=s=>s?new Date(s+'T12:00:00+05:30').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'}):'—';
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No records yet.</div>')+'</div>'}
const match=o=>JSON.stringify(o).toLowerCase().includes(query.toLowerCase());
const editIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-13 13H3v-5L16 3Z"/><path d="m14 5 5 5"/></svg>';
const deleteIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
function actions(kind,id){const attribute={category:'category',competition:'comp',participant:'user'}[kind];return '<span class="record-actions"><button type="button" class="icon-action" data-edit-'+attribute+'="'+safe(id)+'" aria-label="Edit '+kind+'" title="Edit '+kind+'">'+editIcon+'</button><button type="button" class="icon-action delete" data-delete-kind="'+kind+'" data-delete-id="'+safe(id)+'" aria-label="Delete '+kind+'" title="Delete '+kind+'">'+deleteIcon+'</button></span>';}
async function removeRecord(button){const kind=button.dataset.deleteKind,id=button.dataset.deleteId;const records=kind==='category'?data.categories:kind==='competition'?data.competitions:kind==='participant'?data.participants:data.entries;const record=records.find(r=>r.id===id);if(!record||!window.confirm('Delete '+kind+' "'+(record.title||record.name)+'"? This cannot be undone.'))return;button.disabled=true;try{await api('admin/delete',{kind,id});data=await api('admin/overview');render();toast('Deleted successfully.')}catch(error){toast(error.message)}finally{button.disabled=false;}}
function competitionRows(items){return items.map(c=>'<tr><td class="wrap"><b>'+safe(c.title)+'</b><small>'+safe(c.category)+'</small></td><td>'+date(c.deadline)+'<small>11:59 PM IST</small></td><td>'+data.entries.filter(e=>e.competition===c.id).length+'</td><td>'+badge(c.status)+'</td><td>'+feeLabel(c.fee)+'</td><td>'+actions('competition',c.id)+'</td></tr>')}
function connections(){return Object.entries({database:'MySQL database',payments:'Razorpay payments',webhook:'Payment webhook',ai:'AI judging'}).map(([key,label])=>'<div class="connection"><span>'+label+'</span>'+badge(data.ready[key]?'Configured':'Not configured')+'</div>').join('')}
function render(){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#title').textContent=section==='dashboard'?'Admin dashboard':sections[section];$('#subtitle').textContent=section==='dashboard'?'Manage competitions, participants and creative work.':'Manage '+sections[section].toLowerCase()+'.';
 let html='';if(section==='dashboard'){html='<div class="row" style="margin-bottom:20px"><span class="muted">Your competition overview</span><button class="orange" data-new="competition">＋ Create competition</button></div><div class="metrics">'+[['Total participants',data.stats.participants,'Participant accounts'],['Active competitions',data.stats.active,'Currently open for entries'],['Entries awaiting review',data.stats.pending,'Pending or flagged for review'],['Payments received',money(data.stats.collected/100),'Verified captured payments']].map(([label,value,note])=>'<div class="metric"><span class="muted">'+label+'</span><strong>'+value+'</strong><small>'+note+'</small></div>').join('')+'</div><div class="two"><div class="card"><div class="row"><h2>Competitions</h2><button class="secondary" data-go="competitions">View all →</button></div>'+table(['Competition','Deadline','Entries','Status','Fee','Actions'],competitionRows(data.competitions.slice(0,6)))+'</div><div class="card"><h2>Connections</h2>'+connections()+'<p class="muted">Configured status checks saved settings, not provider connectivity.</p></div></div>';}
 else{const add={categories:['category','Add category'],competitions:['competition','Create competition'],participants:['participant','Add participant']};html='<div class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search '+safe(sections[section].toLowerCase())+'…" aria-label="Search records" value="'+safe(query)+'">'+(add[section]?'<button class="orange" data-new="'+add[section][0]+'">＋ '+add[section][1]+'</button>':'')+'</div><div id="records">'+records()+'</div></div>';}$('#content').innerHTML=html;bind();const search=$('#search');if(search)search.oninput=e=>{query=e.target.value;$('#records').innerHTML=records();bind()};}
function records(){if(section==='competitions')return table(['Competition','Deadline','Entries','Status','Fee','Actions'],competitionRows(data.competitions.filter(match)));
if(section==='categories'){const managed=data.categories;const legacy=[...new Set(data.competitions.map(c=>c.category))].filter(n=>!managed.some(c=>c.name===n));return table(['Category','Competitions','Status','Actions'],managed.filter(match).map(c=>'<tr><td>'+safe(c.name)+'</td><td>'+data.competitions.filter(x=>x.category===c.name).length+'</td><td>'+badge(c.active?'Active':'Inactive')+'</td><td>'+actions('category',c.id)+'</td></tr>'))+(legacy.length?'<p class="muted">Existing competition categories: '+legacy.map(safe).join(', ')+'. Add matching categories here to manage their availability.</p>':'');}
if(section==='participants')return table(['Name','Email','Status','Actions'],data.participants.filter(p=>p.role!=='admin').filter(match).map(p=>'<tr><td>'+safe(p.name)+'</td><td>'+safe(p.email)+'</td><td>'+badge(p.disabled?'Suspended':'Active')+'</td><td>'+actions('participant',p.id)+'</td></tr>'));
if(section==='entries')return table(['Entry','Participant','Competition','Review','AI score','Actions'],data.entries.filter(match).map(e=>'<tr><td class="wrap"><b>'+safe(e.title)+'</b><small>'+safe(e.certificate)+'</small></td><td>'+safe(e.name)+'</td><td class="wrap">'+safe(compName(e.competition))+'</td><td>'+badge(e.reviewStatus||'pending')+'</td><td>'+safe(e.score??'Not scored')+'<small>'+safe(e.status)+'</small></td><td><button class="secondary" data-review="'+safe(e.id)+'">Review</button><a class="action" href="/certificate/'+encodeURIComponent(e.id)+'" target="_blank" rel="noopener">Certificate ↗</a><button type="button" class="icon-action delete" data-delete-kind="entry" data-delete-id="'+safe(e.id)+'" aria-label="Delete entry" title="Delete entry">'+deleteIcon+'</button></td></tr>'));
if(section==='payments')return '<p class="muted">Payment records are read-only. Refunds and prize payouts are handled separately by the organizer.</p>'+table(['Order','Participant','Competition','Amount','Status','Payment reference'],data.payments.filter(match).map(p=>'<tr><td>'+safe(p.id)+'</td><td>'+safe(p.email)+'</td><td class="wrap">'+safe(compName(p.competition))+'</td><td>'+money(p.amount/100)+'</td><td>'+badge(p.paid?'Paid':'pending')+'</td><td>'+safe(p.payment||'—')+'</td></tr>'));
return '<h2>Service connections</h2>'+connections()+'<p class="muted">Credentials are managed in Hostinger → Environment variables. Secret values are never displayed here.</p><div class="connection"><span>Time zone</span><b>Asia/Kolkata (IST)</b></div><div class="connection"><span>Signed-in administrator</span><span>'+safe(user.email)+'</span></div><p class="muted">Administrator accounts are created or recovered using the secure server setup commands.</p>';}
function bind(){document.querySelectorAll('[data-delete-kind]').forEach(b=>b.onclick=()=>removeRecord(b));document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>edit(b.dataset.new));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{section=b.dataset.go;query='';render()});document.querySelectorAll('[data-edit-comp]').forEach(b=>b.onclick=()=>edit('competition',data.competitions.find(c=>c.id===b.dataset.editComp)));document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>edit('category',data.categories.find(c=>c.id===b.dataset.editCategory)));document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>edit('participant',data.participants.find(c=>c.id===b.dataset.editUser)));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(data.entries.find(e=>e.id===b.dataset.review)));}
function field(label,name,value='',type='text',extra=''){return '<div><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+safe(value)+'" '+extra+'></div>'}
function edit(kind,item){editorKind=kind;editing=item;$('#editorError').textContent='';$('#editorTitle').textContent=(item?'Edit ':'Create ')+kind;let html='';if(kind==='category')html=field('Category name','name',item?.name||'','text','required maxlength="50"')+'<label>Status</label><select name="active"><option value="true">Active</option><option value="false" '+(item?.active===false?'selected':'')+'>Inactive</option></select>';
if(kind==='participant')html=field('Full name','name',item?.name||'','text','required maxlength="100"')+field('Email address','email',item?.email||'','email','required '+(item?'readonly':''))+(item?'<label>Account status</label><select name="disabled"><option value="false">Active</option><option value="true" '+(item.disabled?'selected':'')+'>Suspended</option></select><p class="muted">Suspension signs the participant out and prevents login.</p>':field('Initial password','password','','password','required minlength="4" maxlength="20" autocomplete="new-password"')+'<p class="muted">Share credentials securely. This action does not send an invitation email.</p>');
if(kind==='competition'){const c=item||{fee:199,prizes:[0,0,0],status:'draft'};const names=[...new Set([...data.categories.filter(x=>x.active).map(x=>x.name),...(c.category?[c.category]:[])])];html='<div class="formgrid"><div class="full">'+field('Competition name','title',c.title||'','text','required maxlength="200"')+'</div><div><label>Category</label><select name="category" required><option value="">Select category</option>'+names.map(n=>'<option '+(n===c.category?'selected':'')+'>'+safe(n)+'</option>').join('')+'</select></div>'+field('Entry fee (₹)','fee',c.fee,'number','min="0" max="100000" step="0.01" placeholder="0 = Free"')+field('Submission deadline (IST)','deadline',c.deadline||'','date','required')+'<div><label>Status</label><select name="status">'+['draft','open','closed'].map(s=>'<option '+(s===c.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="full"><label>Theme / description</label><textarea name="description" required maxlength="5000">'+safe(c.description||'')+'</textarea><label>Rules</label><textarea name="rules" required maxlength="10000">'+safe(c.rules||'')+'</textarea></div>'+c.prizes.map((p,i)=>field(['First','Second','Third'][i]+' prize (₹)','p'+i,p,'number','required min="0" step="0.01"'))+'</div><p class="muted">Theme, category, fees, rules and prizes are locked once orders exist. Deadline is 11:59 PM IST. Image submissions are currently supported.</p>'+(names.length?'':'<div class="notice">Add an active category in Categories before creating a competition.</div>');}
$('#editorForm').innerHTML=html+'<button class="orange" style="margin-top:22px;width:100%">Save '+kind+'</button>';$('#editor').showModal();}
$('#editorForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button:not(.password-toggle)');b.disabled=true;const body=Object.fromEntries(new FormData(e.target));if(editing)body.id=editing.id;if(editorKind==='category')body.active=body.active==='true';if(editorKind==='participant')body.disabled=body.disabled==='true';if(editorKind==='competition'){body.fee=Number(body.fee);body.prizes=[0,1,2].map(i=>Number(body['p'+i]));}try{await api('admin/'+editorKind,body);data=await api('admin/overview');$('#editor').close();render();toast('Saved successfully.')}catch(error){$('#editorError').textContent=error.message}finally{b.disabled=false}};
function review(entry){$('#previewBody').innerHTML='<h2>'+safe(entry.title)+'</h2><p class="muted">'+safe(entry.name)+' · '+safe(compName(entry.competition))+'</p><img class="image" src="/api/admin/art/'+encodeURIComponent(entry.id)+'" alt="Submitted artwork"><p>'+safe(entry.feedback||'No AI feedback yet.')+'</p>'+badge(entry.reviewStatus||'pending')+'<p>'+safe(entry.reviewReason||'')+'</p><form id="reviewForm"><label>Review decision</label><select name="reviewStatus"><option value="accepted">Accept</option><option value="rejected">Reject</option></select><label>Reason / remarks (required for rejection)</label><textarea name="reason" maxlength="1000">'+safe(entry.reviewReason||'')+'</textarea><button style="margin-top:16px">Save review</button> <button id="judge" class="secondary" type="button" '+(!data.ready.ai||entry.reviewStatus==='rejected'?'disabled':'')+'>Run AI judging</button><p class="error" id="reviewError" role="alert"></p></form>';$('#preview').showModal();$('#reviewForm').onsubmit=async ev=>{ev.preventDefault();const button=ev.target.querySelector('button:not(.password-toggle)');button.disabled=true;try{await api('admin/review',{id:entry.id,...Object.fromEntries(new FormData(ev.target))});data=await api('admin/overview');$('#preview').close();render();toast('Review saved.')}catch(e){$('#reviewError').textContent=e.message}finally{button.disabled=false}};$('#judge').onclick=async ev=>{ev.target.disabled=true;try{await api('judge',{id:entry.id});data=await api('admin/overview');reviewRefresh(entry.id);toast('Judging completed.')}catch(e){$('#reviewError').textContent=e.message;ev.target.disabled=false}};}
function reviewRefresh(id){$('#preview').close();review(data.entries.find(e=>e.id===id))}
document.querySelectorAll('dialog .close').forEach(b=>b.onclick=()=>b.closest('dialog').close());load().catch(e=>{$('#login').classList.remove('hide');$('#loginError').textContent=e.message});

// Enhance static and dynamically-created password fields without submitting forms.
function enhancePasswords() {
  document.querySelectorAll('input[type="password"]').forEach(input => {
    if (input.parentElement.classList.contains('password-wrap')) return;
    const wrap = document.createElement('div'); wrap.className = 'password-wrap';
    input.before(wrap); wrap.append(input);
    const toggle = document.createElement('button'); toggle.type = 'button';
    toggle.className = 'password-toggle'; toggle.setAttribute('aria-label', 'Show password');
    toggle.setAttribute('aria-pressed', 'false');
    toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18" style="display:none"/></svg>';
    toggle.onclick = () => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); toggle.setAttribute('aria-pressed', String(show)); toggle.querySelector('.eye-slash').style.display = show ? '' : 'none'; };
    wrap.append(toggle);
  });
}
enhancePasswords();
new MutationObserver(enhancePasswords).observe(document.body, { childList: true, subtree: true });
document.addEventListener('reset', e => { e.target.querySelectorAll('.password-wrap input').forEach(input => { input.type = 'password'; const toggle = input.parentElement.querySelector('.password-toggle'); toggle.setAttribute('aria-label', 'Show password'); toggle.setAttribute('aria-pressed', 'false'); toggle.querySelector('.eye-slash').style.display = 'none'; }); });
</script></body></html>
