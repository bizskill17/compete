function nextPath(){const next=new URLSearchParams(location.search).get('next');if(!next||!next.startsWith('/competition'))return '/dashboard';try{const u=new URL(next,location.origin),slugRoute=/^\/competition\/[a-z0-9]+(?:-[a-z0-9]+)*\/?$/;if(u.origin===location.origin&&(slugRoute.test(u.pathname)||(u.pathname==='/competition'&&/^[a-zA-Z0-9-]{1,80}$/.test(u.searchParams.get('id')))))return u.pathname+u.search;}catch{}return '/dashboard';}

ct id="category" aria-label="Category"><option value="">All categories</option>'+categories.map(c=>'<option '+(category===c?'selected':'')+'>'+safe(c)+'</option>').join('')+'</select><select id="price" aria-label="Entry fee"><option value="">All fees</option><option value="free" '+(price==='free'?'selected':'')+'>Free</option><option value="paid" '+(price==='paid'?'selected':'')+'>Paid</option></select><select id="statusFilter" aria-label="Competition status"><option value="">All status</option><option value="open" '+(statusFilter==='open'?'selected':'')+'>Open now</option><option value="closed" '+(statusFilter==='closed'?'selected':'')+'>Closed</option></select><button type="button" class="btn outline" id="clearFilters">Clear filters</button></div><div id="competitionList" class="cards">'+filteredCards()+'</div></section>';}
function filteredCards(){const cs=state.competitions.filter(c=>(!category||c.category===category)&&(!price||(price==='free'?c.fee===0:c.fee>0))&&(!statusFilter||(statusFilter==='open'?openFor(c):!openFor(c)))&&(c.title+' '+c.category).toLowerCase().includes(query.toLowerCase()));return cs.length?cs.map(card).join(''):'<div class="empty">No competitions match your filters. Try another category or clear the filters.</div>';}
function entryStatus(record){if(record.paymentPending)return 'Payment pending';if(!record.entry)return openFor(record.competition)?'Submission pending':'Deadline passed';if(record.entry.status==='published')return 'Results published';if(record.entry.reviewStatus==='rejected')return 'Submission rejected';return record.entry.reviewStatus==='accepted'?'Under review':'Submitted — awaiting review';}
