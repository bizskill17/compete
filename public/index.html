<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compete — Your next challenge</title><style>
:root{--forest:#153f35;--orange:#f47738;--cream:#f8f7f1;--muted:#6d807b;--line:#dbe4d9}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--forest)}button,input,select,textarea{font:inherit}a{color:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.brand{text-decoration:none;font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--orange)}header{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.header-inner{max-width:1280px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}nav a{padding:9px 13px;text-decoration:none;border-radius:8px;font-size:14px}nav a.active{background:#e6ede2;font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;border:1px solid var(--forest);border-radius:9px;padding:10px 17px;background:var(--forest);color:white;font-weight:650;font-size:14px}.btn.orange{background:var(--orange);border-color:var(--orange);color:white}.btn.outline{background:transparent;color:var(--forest);border-color:#cbd8c9}.btn.danger{background:#fff0ed;border-color:#edcac4;color:#ae302b}.small{font-size:13px;color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:750;color:var(--muted)}h1{font-size:34px;line-height:1.22;letter-spacing:-1px;margin:6px 0 14px}h2{font-size:23px;line-height:1.3;margin:0 0 14px}h3{font-size:19px;line-height:1.4;margin:8px 0}.muted{color:var(--muted)}main{max-width:1200px;margin:auto;padding:34px 28px 70px;min-height:76vh}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.section{margin-top:28px}.hero{padding:24px 0 32px;max-width:780px}.hero h1{font-size:48px;max-width:700px}.hero h1 span{color:var(--orange)}.hero p{max-width:620px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.competition-card{padding:0;overflow:hidden;display:flex;flex-direction:column}.card-body{padding:20px;display:flex;flex-direction:column;flex:1}.card-body>p{margin-top:0}.card-body .btn{margin-top:auto;align-self:flex-start}.art{width:100%;height:190px;object-fit:cover;display:block;background:#e6ede2}.placeholder{display:flex;align-items:center;justify-content:center;gap:12px;background:#e6ede2}.placeholder span{font-size:50px;color:var(--orange)}.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;background:#eaf0e5;color:var(--forest)}.badge.pending{background:#fff0d9;color:#935c12}.badge.rejected{background:#ffebe6;color:#b5352d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stat strong{display:block;font-size:30px;margin-top:4px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.filters input{flex:1;min-width:200px}.filters select{width:auto;min-width:140px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.detail-art{height:300px;border-radius:14px;margin:20px 0}.meta{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}.meta strong{display:block}.notice{background:#edf2e8;border-radius:9px;padding:12px 16px;font-size:13px;margin:14px 0}.error{color:#b8352c;white-space:pre-wrap}.empty{text-align:center;padding:40px 20px;border:1px dashed #bacaaf;border-radius:14px;background:#ffffff70}.auth-card{max-width:460px;margin:28px auto;background:white;padding:32px;border:1px solid var(--line);border-radius:18px}label{display:block;font-size:13px;font-weight:650;margin:15px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd8c9;border-radius:8px;padding:11px 12px;background:white;color:var(--forest)}textarea{min-height:100px;resize:vertical}input[readonly]{background:#f3f5ef}.password{position:relative}.password input{padding-right:50px}.password button{position:absolute;right:4px;top:4px;width:40px;height:38px;background:transparent;border:0;color:var(--forest);display:grid;place-items:center}.password svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.full{width:100%;margin-top:22px}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:5px}.entry-row{display:flex;align-items:center;gap:18px}.entry-thumb{width:130px;height:95px;border-radius:9px;object-fit:cover}.entry-info{flex:1}.progress{margin:18px 0 6px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.progress b{color:var(--forest)}.preview{max-width:100%;max-height:270px;object-fit:contain;border-radius:8px;margin-top:12px}dialog{border:1px solid var(--line);border-radius:16px;width:min(580px,94vw);max-height:92vh;overflow:auto;padding:27px;color:var(--forest)}dialog::backdrop{background:#143a3166}.close{float:right;background:#edf2e8;border:0;border-radius:8px;width:34px;height:34px;font-size:22px;color:var(--forest)}footer{border-top:1px solid var(--line);max-width:1200px;margin:auto;padding:22px 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--forest);color:white;padding:12px 20px;border-radius:10px;z-index:20;max-width:92vw}.hide,[hidden]{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.prizes strong{display:block;font-size:21px}.skeleton{padding:70px;text-align:center}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.header-inner{align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero h1{font-size:38px}}@media(max-width:600px){.header-inner{padding:14px 18px;flex-direction:column;gap:9px}nav{gap:2px}nav a{padding:7px 9px;font-size:12px}main{padding:24px 18px 50px}.cards{grid-template-columns:1fr}.hero h1{font-size:34px}.auth-card{padding:23px;margin:10px auto}.entry-row{align-items:flex-start;flex-wrap:wrap}.entry-thumb{width:95px;height:80px}.prizes{gap:6px}.prizes .card{padding:12px}.prizes strong{font-size:17px}.detail-art{height:220px}.row{align-items:flex-start}}
.profile-layout{max-width:640px;margin:0 auto}.profile-security{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;text-align:center}.text-action{background:transparent;border:0;padding:5px 12px;color:var(--forest);font-weight:650;text-decoration:underline;text-underline-offset:4px}#resetDialog{max-width:460px}</style></head><body><header><div class="header-inner"><a class="brand" href="/" data-route><span>✳</span> compete.</a><nav id="nav" aria-label="Main navigation"></nav></div></header><main id="main"><div class="skeleton">Loading competitions…</div></main><footer><span>Compete · Your talent. Your spotlight.</span><a href="/admin">Admin login</a></footer><dialog id="entryDialog"><button class="close" type="button" aria-label="Close submission">×</button><div id="entryBody"></div></dialog><dialog id="resetDialog" aria-labelledby="resetHeading"><button class="close" type="button" aria-label="Close password reset">×</button><div id="resetBody"></div></dialog><div id="toast" class="toast hide" role="status"></div><script>
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),fee=n=>Number(n)===0?'Free':money(n),date=s=>new Date(s+'T12:00:00+05:30').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
let state={competitions:[],user:null},overview={profile:{},competitions:[]},query='',category='',price='',toastTimer,previewURL;
async function api(path,body){const multipart=body instanceof FormData;const r=await fetch('/api/'+path,body?{method:'POST',headers:multipart?{}:{'Content-Type':'application/json'},body:multipart?body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to complete this request.');return d;}
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),6000)}
function nextPath(){const next=new URLSearchParams(location.search).get('next');if(!next||!next.startsWith('/competition?'))return '/dashboard';try{const u=new URL(next,location.origin);if(u.origin===location.origin&&u.pathname==='/competition'&&/^[a-zA-Z0-9-]{1,80}$/.test(u.searchParams.get('id')))return u.pathname+u.search;}catch{}return '/dashboard';}
function go(path,replace=false){if($('#resetDialog').open)$('#resetDialog').close();history[replace?'replaceState':'pushState']({},'',path);render();window.scrollTo({top:0,behavior:'smooth'})}
const competitionURL=id=>'/competition?id='+encodeURIComponent(id);
function openFor(c){return c.status==='open'&&Date.now()<=Date.parse(c.deadline+'T23:59:59+05:30')}
function thumb(c,cls='art'){return c.thumbnail?'<img class="'+cls+'" src="/api/thumbnail/'+encodeURIComponent(c.id)+'" alt="'+safe(c.title)+'" loading="lazy">':'<div class="'+cls+' placeholder"><span aria-hidden="true">✦</span><b>'+safe(c.category)+'</b></div>'}
const badge=(text,kind='')=>'<span class="badge '+kind+'">'+safe(text)+'</span>';
function password(label,name,autocomplete='current-password'){return '<label for="'+name+'">'+label+'</label><div class="password"><input id="'+name+'" name="'+name+'" type="password" required minlength="4" maxlength="20" autocomplete="'+autocomplete+'"><button type="button" data-toggle="'+name+'" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>'}
function nav(){const logged=!!state.user,items=logged?[['/dashboard','My dashboard'],['/','Explore'],['/my-competitions','My competitions'],['/results','Results & certificates'],['/profile','My profile']]:[['/','Discover'],['/results','Results'],['/login','Login'],['/signup','Sign Up']];$('#nav').innerHTML=items.map(([url,label])=>'<a href="'+url+'" data-route class="'+(location.pathname===url?'active':'')+'">'+label+'</a>').join('')+(state.admin?'<a href="/admin">Admin ↗</a>':'');}
function card(c){return '<article class="card competition-card">'+thumb(c)+'<div class="card-body"><div class="row">'+badge(c.category)+badge(openFor(c)?'Open':'Closed',openFor(c)?'':'pending')+'</div><h3>'+safe(c.title)+'</h3><p class="small">'+safe(c.description.slice(0,150))+(c.description.length>150?'…':'')+'</p><div class="meta"><div><span class="small">Entry fee</span><strong>'+fee(c.fee)+'</strong></div><div><span class="small">Deadline · IST</span><strong>'+date(c.deadline)+'</strong></div></div><a class="btn" href="'+competitionURL(c.id)+'" data-route>View competition ↗</a></div></article>'}
function explore(){return (!state.user?'<section class="hero"><div class="eyebrow">Your talent. Your spotlight.</div><h1>A stage for your <span>competitive spark.</span></h1><p class="muted">Find your next challenge. Join a competition, share your work, and celebrate your progress.</p></section>':'')+'<div class="row"><div><div class="eyebrow">Find your next challenge</div><h1>Explore competitions</h1></div><span class="small">Browse freely. Log in when you’re ready to join.</span></div><div class="filters"><input id="search" type="search" aria-label="Search competitions" placeholder="Search competitions…" value="'+safe(query)+'"><select id="category" aria-label="Category"><option value="">All categories</option>'+[...new Set(state.competitions.map(c=>c.category))].map(c=>'<option '+(category===c?'selected':'')+'>'+safe(c)+'</option>').join('')+'</select><select id="price" aria-label="Entry fee"><option value="">All fees</option><option value="free" '+(price==='free'?'selected':'')+'>Free</option><option value="paid" '+(price==='paid'?'selected':'')+'>Paid</option></select></div><div id="competitionList" class="cards">'+filteredCards()+'</div>';}
function filteredCards(){const cs=state.competitions.filter(c=>(!category||c.category===category)&&(!price||(price==='free'?c.fee===0:c.fee>0))&&(c.title+' '+c.category).toLowerCase().includes(query.toLowerCase()));return cs.length?cs.map(card).join(''):'<div class="empty">No competitions match your search. Try another category or check back soon.</div>';}
function entryStatus(record){if(record.paymentPending)return 'Payment pending';if(!record.entry)return openFor(record.competition)?'Submission pending':'Deadline passed';if(record.entry.status==='published')return 'Results published';if(record.entry.reviewStatus==='rejected')return 'Submission rejected';return record.entry.reviewStatus==='accepted'?'Under review':'Submitted — awaiting review';}
function recordCard(r){const c=r.competition,e=r.entry;let action=r.paymentPending?'<button class="btn orange" data-join="'+safe(c.id)+'">Resume payment</button>':!e&&openFor(c)?'<button class="btn orange" data-submit="'+safe(c.id)+'">Submit entry</button>':e?'<button class="btn outline" data-view-entry="'+safe(e.id)+'">View submission</button>':'';return '<article class="card section"><div class="entry-row">'+thumb(c,'entry-thumb')+'<div class="entry-info">'+badge(entryStatus(r),e?.reviewStatus==='rejected'?'rejected':!e?'pending':'')+'<h3>'+safe(c.title)+'</h3><div class="small">'+safe(c.category)+' · '+fee(c.fee)+' · Deadline '+date(c.deadline)+' IST</div>'+(e?.reviewStatus==='rejected'?'<p class="error">'+safe(e.reviewReason)+'</p>':'')+'</div><div>'+action+'</div></div><div class="progress"><b>'+(r.paymentPending?'Complete payment':'✓ Joined')+'</b><span>→</span><'+(e?'b':'span')+'>'+(e?'✓ Submitted':'Submit your entry')+'</'+(e?'b':'span')+'><span>→</span><span>'+(e?.status==='published'?'✓ Results published':'Review & results')+'</span></div></article>';}
function dashboard(){const joined=overview.competitions.filter(r=>r.joined),pending=joined.filter(r=>!r.entry&&openFor(r.competition)),results=joined.filter(r=>r.entry?.status==='published'),certs=joined.filter(r=>r.entry?.certificate);return '<div class="row"><div><div class="eyebrow">Your participant space</div><h1>Welcome back, '+safe(overview.profile.name||state.user.name||'participant')+'.</h1><p class="muted">Your next achievement starts with one entry.</p></div><a class="btn orange" href="/" data-route>Explore competitions ↗</a></div><div class="stats">'+[['Joined',joined.length],['Submissions pending',pending.length],['Results published',results.length],['Certificates',certs.length]].map(([label,n])=>'<div class="card stat"><span class="small">'+label+'</span><strong>'+n+'</strong></div>').join('')+'</div><h2>Upcoming deadlines</h2>'+(pending.length?pending.sort((a,b)=>a.competition.deadline.localeCompare(b.competition.deadline)).slice(0,3).map(recordCard).join(''):'<div class="empty">No submissions are waiting. <a href="/" data-route>Find your next competition.</a></div>')+'<div class="section row"><h2>Your recent competitions</h2><a href="/my-competitions" data-route>View all →</a></div>'+(overview.competitions.length?overview.competitions.slice().reverse().slice(0,3).map(recordCard).join(''):'<div class="empty">You haven’t joined a competition yet.</div>');}
function details(){const id=new URLSearchParams(location.search).get('id'),c=state.competitions.find(c=>c.id===id);if(!c)return '<div class="empty"><h1>Competition not found</h1><a href="/" data-route>Explore competitions</a></div>';const r=overview.competitions.find(r=>r.competition.id===id);let action=!openFor(c)?'<p class="notice">Entries are closed.</p>':r?.entry?'<button class="btn" data-view-entry="'+safe(r.entry.id)+'">View submission</button>':r?.joined?'<button class="btn orange full" data-submit="'+safe(c.id)+'">Submit entry</button>':state.user?'<button class="btn orange full" data-join="'+safe(c.id)+'">'+(c.fee===0?'Join free':'Pay '+fee(c.fee)+' & join')+'</button>':'<a class="btn orange full" href="/login?next='+encodeURIComponent(competitionURL(c.id))+'" data-route>Log in to join</a>';return '<a href="/" data-route>← All competitions</a>'+thumb(c,'art detail-art')+'<div class="eyebrow">'+safe(c.category)+'</div><h1>'+safe(c.title)+'</h1><div class="two"><div><section class="card"><h2>About this competition</h2><p style="white-space:pre-wrap">'+safe(c.description)+'</p><h2 class="section">Rules</h2><p style="white-space:pre-wrap">'+safe(c.rules)+'</p><div class="notice">Submission: one original JPG, PNG or WebP image, up to 5 MB. Image-based judging is currently supported.</div></section><div class="prizes">'+c.prizes.map((p,i)=>'<div class="card"><span class="small">'+['First','Second','Third'][i]+' prize</span><strong>'+money(p)+'</strong></div>').join('')+'</div></div><aside class="card" style="align-self:start"><h2>'+fee(c.fee)+' <span class="small">/ entry</span></h2><p>Deadline: <b>'+date(c.deadline)+'</b><br><span class="small">11:59 PM IST</span></p>'+badge(r?entryStatus(r):openFor(c)?'Open for entries':'Closed')+action+'<p class="small">Join now and submit before the deadline. A participation certificate becomes available after your entry is accepted. Final scores and rankings appear after the organizer publishes results.</p></aside></div>';}
function resultPage(){const id=new URLSearchParams(location.search).get('id');return '<h1>Results & certificates</h1><p class="muted">Final results are released by the organizer after review.</p>'+(state.user?'<h2 class="section">Your certificates</h2>'+(overview.competitions.some(r=>r.entry?.certificate)?overview.competitions.filter(r=>r.entry?.certificate).map(r=>'<div class="card section row"><div><h3>'+safe(r.competition.title)+'</h3><span class="small">'+safe(r.entry.title)+'</span></div><div class="row"><a class="btn outline" target="_blank" rel="noopener" href="/certificate/'+encodeURIComponent(r.entry.id)+'">Participation certificate ↗</a>'+(r.entry.winner?'<a class="btn orange" target="_blank" rel="noopener" href="/certificate/'+encodeURIComponent(r.entry.id)+'?kind=winner">Winner certificate ↗</a>':'')+'</div></div>').join(''):'<div class="empty">Certificates appear after your submitted entry is accepted.</div>'):'')+'<h2 class="section">Published leaderboards</h2><select id="boardSelect" aria-label="Choose published competition"><option value="">Select a competition</option>'+state.competitions.filter(c=>c.resultsPublished).map(c=>'<option value="'+safe(c.id)+'" '+(c.id===id?'selected':'')+'>'+safe(c.title)+'</option>').join('')+'</select><div id="board" class="section empty">'+(state.competitions.some(c=>c.resultsPublished)?'Choose a competition to view final results.':'No results have been published yet.')+'</div>';}
function authPage(mode){const next=nextPath(),suffix=next!=='/dashboard'?'?next='+encodeURIComponent(next):'';const signup=mode==='signup',forgot=mode==='forgot-password',reset=mode==='reset-password';return '<section class="auth-card"><div class="eyebrow">Participant access</div><h1>'+ (signup?'Create your account.':forgot?'Forgot your password?':reset?'Choose a new password.':'Welcome back.')+'</h1><p class="muted">'+(signup?'Join competitions and keep your progress in one place.':forgot?'We’ll email you a password reset link.':reset?'Use a password of 4–20 characters.':'Log in to your participant account.')+'</p><form id="authForm" data-mode="'+mode+'">'+(signup?'<label for="name">Full name</label><input id="name" name="name" required maxlength="100" autocomplete="name"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" required maxlength="20" pattern="[+]?[0-9 ]{7,20}" autocomplete="tel">':'')+(!reset?'<label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username">':'')+(!forgot?password('Password','password',signup||reset?'new-password':'current-password'):'')+(signup||reset?password('Confirm password','confirmPassword','new-password'):'')+'<button class="btn orange full" type="submit">'+(signup?'Create account':forgot?'Send reset link':reset?'Reset password':'Log in')+'</button><p id="authError" role="alert" class="error"></p><p id="authMessage" role="status"></p></form>'+(!signup&&!forgot&&!reset?'<p><a href="/forgot-password" data-route>Forgot password?</a></p>':'')+'<p class="small">'+(signup?'Already have an account? <a href="/login'+safe(suffix)+'" data-route>Log in</a>':forgot||reset?'<a href="/login" data-route>Back to login</a>':'New here? <a href="/signup'+safe(suffix)+'" data-route>Create an account</a>')+'</p><a class="small" href="/" data-route>← Browse competitions</a></section>';}
function profilePage(){const p=overview.profile;return '<div class="profile-layout"><h1>My profile</h1><form id="profileForm" class="card"><h2>Personal details</h2><label for="profileName">Full name</label><input id="profileName" name="name" required maxlength="100" value="'+safe(p.name)+'"><label for="profileEmail">Email address</label><input id="profileEmail" type="email" readonly value="'+safe(p.email)+'"><small>Email changes require organizer assistance.</small><label for="profileMobile">Mobile number</label><input id="profileMobile" name="mobile" type="tel" required pattern="[+]?[0-9 ]{7,20}" maxlength="20" value="'+safe(p.mobile)+'"><button class="btn orange full">Save profile</button><p class="error" role="alert"></p><div class="profile-security"><button type="button" id="openReset" class="text-action">Reset password</button></div></form><button class="btn danger section" id="logout">Log out</button></div>';}
function openPasswordReset(){if(!state.user)return;$('#resetBody').innerHTML='<h2 id="resetHeading">Reset password</h2><p>We’ll send a secure link to your registered email. You can choose a new password after opening the link.</p><form id="resetEmailForm"><label for="resetEmail">Registered email</label><input id="resetEmail" type="email" readonly value="'+safe(overview.profile.email)+'"><button class="btn orange full" type="submit">Send reset link</button><button class="btn outline full" type="button" id="cancelReset">Cancel</button><p class="error" role="alert"></p><p class="reset-message" role="status" aria-live="polite"></p></form>';const dialog=$('#resetDialog'),form=$('#resetEmailForm'),email=overview.profile.email;dialog.showModal();$('#cancelReset').onclick=()=>dialog.close();form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('[type=submit]'),error=form.querySelector('.error'),message=form.querySelector('.reset-message');button.disabled=true;error.textContent='';message.textContent='';try{const result=await api('auth/forgot',{email});message.textContent=result.message;button.textContent='Reset link requested';}catch(e){error.textContent=e.message;button.disabled=false;}};}

function render(){if(location.pathname!=='/profile'&&$('#resetDialog').open)$('#resetDialog').close();nav();const path=location.pathname;const protectedPage=['/dashboard','/my-competitions','/profile'].includes(path);if(protectedPage&&!state.user){go('/login',true);return;}if(['/login','/signup'].includes(path)&&state.user){go(nextPath(),true);return;}let html;if(['/login','/signup','/forgot-password','/reset-password'].includes(path))html=authPage(path.slice(1));else if(path==='/dashboard')html=dashboard();else if(path==='/my-competitions')html='<h1>My competitions</h1><p class="muted">Your registrations, submissions, and next steps.</p>'+(overview.competitions.length?overview.competitions.map(recordCard).join(''):'<div class="empty">You haven’t joined a competition yet. <a href="/" data-route>Explore competitions.</a></div>');else if(path==='/competition')html=details();else if(path==='/results')html=resultPage();else if(path==='/profile')html=profilePage();else html=explore();$('#main').innerHTML=html;bind();}
async function refresh(){state=await api('state');state.competitions=state.demo?[]:state.competitions.filter(c=>c.status!=='draft');overview=state.user?await api('participant/overview'):{profile:{},competitions:[]};}
async function loadBoard(id){if(!id)return;try{const rows=await api('leaderboard?id='+encodeURIComponent(id));$('#board').className='section card table-wrap';$('#board').innerHTML=rows.length?'<table><thead><tr><th>Rank</th><th>Participant / entry</th><th>Final score</th></tr></thead><tbody>'+rows.map(e=>'<tr><td>'+e.rank+'</td><td><b>'+safe(e.name)+'</b><br>'+safe(e.title)+'<p class="small">'+safe(e.feedback)+'</p></td><td>'+e.score+' / 100</td></tr>').join('')+'</tbody></table>':'No ranked entries in these published results.';}catch(e){toast(e.message)}}
function bind(){if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#competitionList').innerHTML=filteredCards()};for(const name of ['category','price'])if($('#'+name))$('#'+name).onchange=e=>{if(name==='category')category=e.target.value;else price=e.target.value;$('#competitionList').innerHTML=filteredCards()};if($('#boardSelect')){$('#boardSelect').onchange=e=>go('/results?id='+encodeURIComponent(e.target.value));if($('#boardSelect').value)loadBoard($('#boardSelect').value);}if($('#authForm'))$('#authForm').onsubmit=handleAuth;if($('#profileForm'))$('#profileForm').onsubmit=e=>saveProfile(e);if($('#openReset'))$('#openReset').onclick=openPasswordReset;if($('#logout'))$('#logout').onclick=async()=>{try{await api('auth/logout',{});await refresh();go('/login')}catch(e){toast(e.message)}};}
async function handleAuth(event){event.preventDefault();const form=event.target,mode=form.dataset.mode,button=form.querySelector('[type=submit]');button.disabled=true;$('#authError').textContent='';$('#authMessage').textContent='';const body=Object.fromEntries(new FormData(form));try{if(body.confirmPassword!==undefined&&body.password!==body.confirmPassword)throw Error('Passwords do not match.');if(mode==='reset-password')body.token=new URLSearchParams(location.search).get('token');const response=await api('auth/'+({signup:'register',login:'login','forgot-password':'forgot','reset-password':'reset'}[mode]),body);if(mode==='forgot-password')$('#authMessage').textContent=response.message;else if(mode==='reset-password'){await api('auth/logout',{});await refresh();go('/login',true);toast('Password reset. Log in with your new password.');}else{const destination=nextPath();await refresh();go(destination,true);}}catch(e){$('#authError').textContent=e.message}finally{button.disabled=false}}
async function saveProfile(event){event.preventDefault();const form=event.target,button=form.querySelector('.btn'),error=form.querySelector('.error'),body=Object.fromEntries(new FormData(form));button.disabled=true;error.textContent='';try{await api('participant/profile',body);await refresh();render();toast('Profile updated.');}catch(e){error.textContent=e.message}finally{button.disabled=false}}

let checkoutScript;
async function loadCheckout(){if(window.Razorpay)return;if(!checkoutScript)checkoutScript=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://checkout.razorpay.com/v1/checkout.js';script.onload=()=>window.Razorpay?resolve():reject(Error('Payment checkout is unavailable.'));script.onerror=()=>{script.remove();checkoutScript=null;reject(Error('Payment checkout could not load. Please retry.'))};document.head.append(script)});await checkoutScript;}
async function join(id,button){if(!state.user){go('/login?next='+encodeURIComponent(competitionURL(id)));return;}button.disabled=true;try{const order=await api('order',{competition:id});if(order.free||order.paid){await refresh();render();toast('You have joined. Submit your entry before the deadline.');return;}await loadCheckout();const c=state.competitions.find(c=>c.id===id);const checkout=new Razorpay({key:order.key,order_id:order.id,amount:order.amount,currency:'INR',name:'Compete',description:c?.title||'Competition registration',prefill:{name:overview.profile.name,email:overview.profile.email,contact:overview.profile.mobile},theme:{color:'#153f35'},handler:async result=>{try{await api('verify',result);await refresh();render();toast('Payment verified. Registration confirmed.');}catch(e){toast(e.message+' Use Resume payment to recover your payment.');}finally{button.disabled=false}},modal:{ondismiss:()=>{button.disabled=false}}});checkout.on('payment.failed',()=>toast('Payment was unsuccessful. You can retry from My competitions.'));checkout.open();}catch(e){toast(e.message)}finally{button.disabled=false}}
function showSubmission(id){const r=overview.competitions.find(r=>r.entry?.id===id);if(!r)return;const e=r.entry;$('#entryBody').innerHTML='<h2>'+safe(e.title)+'</h2><p>'+safe(r.competition.title)+'</p>'+badge(entryStatus(r),e.reviewStatus==='rejected'?'rejected':'')+'<img class="preview" src="/api/participant/art/'+encodeURIComponent(e.id)+'" alt="Your submitted entry"><p class="small">Submitted '+new Date(e.created).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' IST</p>'+(e.reviewReason?'<p class="error">'+safe(e.reviewReason)+'</p>':'')+(e.status==='published'?'<h3>Rank '+e.rank+' · '+e.score+' / 100</h3><p>'+safe(e.feedback)+'</p>':'<p class="notice">Your entry is saved. Final scores and feedback will appear when results are published.</p>')+(e.certificate?'<a class="btn outline" target="_blank" rel="noopener" href="/certificate/'+encodeURIComponent(e.id)+'">Participation certificate ↗</a>':'');$('#entryDialog').showModal();}
function submitDialog(id){const c=state.competitions.find(c=>c.id===id),r=overview.competitions.find(r=>r.competition.id===id);if(!c||!r?.joined||!openFor(c))return toast('Join an open competition before submitting.');$('#entryBody').innerHTML='<h2>Submit your entry</h2><p>'+safe(c.title)+'</p><p class="small">Closes '+date(c.deadline)+' · 11:59 PM IST</p><form id="submissionForm"><input type="hidden" name="competition" value="'+safe(c.id)+'"><label>Participant name</label><input name="name" readonly required value="'+safe(overview.profile.name)+'"><label for="entryTitle">Entry title</label><input id="entryTitle" name="title" required maxlength="150"><label for="entryImage">Upload your entry</label><input id="entryImage" type="file" name="image" accept="image/jpeg,image/png,image/webp" required><small>One JPG, PNG or WebP · up to 5 MB</small><img id="uploadPreview" class="preview" alt="Entry preview" hidden><label class="check"><input type="checkbox" name="original" value="yes" required>I confirm this is my original work and follows the competition rules.</label><button class="btn orange full" type="submit">Submit entry</button><p class="error" role="alert"></p></form>';$('#entryDialog').showModal();$('#entryImage').onchange=event=>{const file=event.target.files[0];if(previewURL)URL.revokeObjectURL(previewURL);$('#uploadPreview').hidden=true;if(!file)return;const valid=file.size>0&&file.size<=5*1024*1024&&['image/jpeg','image/png','image/webp'].includes(file.type);event.target.setCustomValidity(valid?'':'Choose a JPG, PNG or WebP up to 5 MB.');if(valid){previewURL=URL.createObjectURL(file);$('#uploadPreview').src=previewURL;$('#uploadPreview').hidden=false;}};$('#submissionForm').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]');button.disabled=true;form.querySelector('.error').textContent='';try{await api('submit',new FormData(form));$('#entryDialog').close();await refresh();go('/my-competitions');toast('Entry received. You can track its review here.');}catch(e){form.querySelector('.error').textContent=e.message}finally{button.disabled=false}};}
document.addEventListener('click',event=>{const toggle=event.target.closest('[data-toggle]');if(toggle){const input=document.getElementById(toggle.dataset.toggle),visible=input.type==='password';input.type=visible?'text':'password';toggle.setAttribute('aria-label',visible?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(visible));return;}const link=event.target.closest('a[data-route]');if(link&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&event.button===0){event.preventDefault();go(link.getAttribute('href'));return;}const joinButton=event.target.closest('[data-join]');if(joinButton){join(joinButton.dataset.join,joinButton);return;}const submit=event.target.closest('[data-submit]');if(submit)submitDialog(submit.dataset.submit);const view=event.target.closest('[data-view-entry]');if(view)showSubmission(view.dataset.viewEntry);});
$('#resetDialog .close').onclick=()=>$('#resetDialog').close();$('#resetDialog').onclose=()=>{$('#resetBody').querySelectorAll('input[type=password]').forEach(input=>input.value='')};$('#entryDialog .close').onclick=()=>$('#entryDialog').close();$('#entryDialog').onclose=()=>{if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null;}};window.onpopstate=()=>render();
refresh().then(()=>{if(location.pathname==='/'&&state.user)go('/dashboard',true);else render();}).catch(e=>{$('#main').innerHTML='<div class="empty"><h1>Unable to load your competitions</h1><p>'+safe(e.message)+'</p><button class="btn" onclick="location.reload()">Retry</button></div>'});
</script></body></html>
